<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1458"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <radialGradient id="heat" cx="0.5" cy="0.62" r="0.6">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff2d95" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.45" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tile">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <rect width="64" height="64" fill="url(#heat)"/>
    <!-- scan lines -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 9.5h64M0 17.5h64M0 25.5h64M0 33.5h64M0 41.5h64M0 49.5h64M0 57.5h64"/>
    </g>
  </g>

  <!-- HDMI plug with a play mark -->
  <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-linejoin="round" stroke-linecap="round">
    <path d="M11 22h42v13l-7 8H18l-7-8z" stroke-width="3.2"/>
  </g>
  <path d="M28 26.5v11l10-5.5z" fill="#fff4e0" stroke="#fff4e0" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- recording light -->
  <g filter="url(#glow)">
    <circle cx="51" cy="13" r="4" fill="#ff3b3b"/>
  </g>
  <circle cx="49.8" cy="11.8" r="1.2" fill="#ffffff" fill-opacity="0.7"/>
</svg>
